<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK SEVENTH EXAM</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #b91c1c;
      --skip-bg: #fef3c7;
      --skip-border: #f59e0b;
      --skip-text: #b45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .quiz-card { background: var(--card-bg); width: 100%; max-width: 680px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); }
    .progress-text { font-size: 14px; font-weight: 600; color: var(--primary-color); background: rgba(79, 70, 229, 0.1); padding: 6px 14px; border-radius: 20px; }
    .progress-bar-container { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
    .progress-bar { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 20px; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; padding: 14px 18px; font-size: 16px; text-align: left; background: transparent; color: var(--text-main); border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background-color: rgba(79, 70, 229, 0.05); }
    .option-btn.selected { border-color: var(--primary-color); background-color: rgba(79, 70, 229, 0.1); font-weight: 600; }
    
    .footer-actions { margin-top: 28px; display: flex; justify-content: space-between; gap: 10px; }
    .btn { padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-prev { background-color: #e2e8f0; color: #475569; }
    .btn-skip { background-color: #fef3c7; color: #b45309; }
    .btn-next { background-color: var(--primary-color); color: white; }
    .btn-submit { background-color: #16a34a; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .user-info-screen, .result-screen { text-align: center; display: none; }
    .user-info-screen { padding: 10px 5px; }
    .welcome-icon { font-size: 45px; margin-bottom: 10px; display: inline-block; animation: bounce 2s infinite; }
    .user-info-screen h2 { font-size: 26px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    .user-info-screen p { color: var(--text-muted); font-size: 15px; margin-top: 6px; margin-bottom: 25px; }
    .input-group { position: relative; margin-bottom: 25px; }
    .user-info-screen input { width: 100%; padding: 16px 20px; font-size: 16px; color: var(--text-main); background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: all 0.3s ease; }
    .user-info-screen input:focus { border-color: var(--primary-color); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }
    .start-btn { width: 100%; background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: white; border: none; padding: 16px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.4); }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .score-circle { width: 150px; height: 150px; border-radius: 50%; background: rgba(79, 70, 229, 0.1); color: var(--primary-color); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto; font-size: 36px; font-weight: 800; }
    .score-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- ১. Name Screen -->
    <div id="user-info-view" class="user-info-screen" style="display: block;">
      <div class="welcome-icon">📝</div>
      <h2>Welcome to GK SEVENTH Exam!</h2>
      <p>Write your full name below to begin</p>
      
      <div class="input-group">
        <input type="text" id="user-name" placeholder="Write your name here..." autocomplete="off" onkeypress="handleEnter(event)">
      </div>
      
      <button class="start-btn" onclick="startQuiz()">Start Exam ➔</button>
    </div>

    <!-- ২. Quiz Screen -->
    <div id="quiz-view" style="display: none;">
      <div class="top-bar">
        <h2 id="display-name" style="font-size: 16px;"></h2>
        <span class="progress-text" id="progress-text">Question 1/40</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-title">QUESTION LOADING...</div>

      <div class="options-grid" id="options-grid"></div>

      <div class="footer-actions">
        <button class="btn btn-prev" id="prev-btn" onclick="navigate(-1)">◄ Previous</button>
        <button class="btn btn-skip" id="skip-btn" onclick="skipQuestion()">Skip ↷</button>
        <button class="btn btn-next" id="next-btn" onclick="navigate(1)">Next ►</button>
        <button class="btn btn-submit" id="submit-btn" style="display: none;" onclick="confirmFinish()">Submit Exam ✔</button>
      </div>
    </div>

    <!-- ৩. Result Screen -->
    <div class="result-screen" id="result-view">
      <h2>Exam Finished!</h2>
      <p style="color: var(--text-muted)">Apnar result successfully submit hoyese!</p>
      
      <div class="score-circle">
        <div id="final-score">0.00</div>
        <span style="font-size: 14px; color: var(--text-muted);">Total Score / 40</span>
      </div>

      <div class="score-details">
        <div><strong style="color: var(--correct-border); font-size: 18px;" id="correct-count">0</strong><br><small>Sathik (+1.00)</small></div>
        <div><strong style="color: var(--wrong-border); font-size: 18px;" id="wrong-count">0</strong><br><small>Bhul (-0.25)</small></div>
        <div><strong style="color: var(--skip-border); font-size: 18px;" id="skipped-count">0</strong><br><small>Skipped (0.00)</small></div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCTgSqtcDRtvfbIECDFEv_2jAEgModArXc",
      authDomain: "gk-exam-2.firebaseapp.com",
      projectId: "gk-exam-2",
      storageBucket: "gk-exam-2.firebasestorage.app",
      messagingSenderId: "52008698353",
      appId: "1:52008698353:web:08a24e1451711ab72f0450",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const questionsDatabase = [
      { question: "1. Ancient Bengal-er Bikrampur kon jonopoder ontorbukto chilo?", options: ["Varendra", "Vanga", "Rarh", "Samatata"], correct: 1 },
      { question: "2. Matsyanyaya bolte ki bujhay?", options: ["Krishi Bebostha", "Rajnitik Arajokota", "Dharmik Utsab", "Shainik Kar"], correct: 1 },
      { question: "3. Roman Empire-er sathe kon bondor-er banijjik somporko chilo?", options: ["Tamralipta", "Saptagram", "Chittagong", "Sonargaon"], correct: 0 },
      { question: "4. Sen राजवंश-er somoy kon dhormo shoktishali hoy?", options: ["Shaiva & Vaishnava", "Zoroastrian", "Shinto", "Protestant"], correct: 0 },
      { question: "5. Mansabdari pratha ki niyontron korto?", options: ["Jomir Malikana", "Sainik & Besainik Podomorjada", "Dharmik Nirbachon", "Shulko"], correct: 1 }
    ];

    let userName = "";
    let currentIndex = 0;
    let userAnswers = new Array(questionsDatabase.length).fill(null);

    function handleEnter(e) { if(e.key === 'Enter') startQuiz(); }

    function startQuiz() {
      const input = document.getElementById('user-name').value.trim();
      if(!input) return alert("Apnar naam লিখুন!");
      userName = input;
      document.getElementById('display-name').innerText = `Student: ${userName}`;
      document.getElementById('user-info-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const q = questionsDatabase[currentIndex];
      document.getElementById('question-title').innerText = q.question;
      document.getElementById('progress-text').innerText = `Question ${currentIndex + 1}/${questionsDatabase.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questionsDatabase.length) * 100}%`;

      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (userAnswers[currentIndex] === idx ? ' selected' : '');
        btn.innerText = opt;
        btn.onclick = () => {
          userAnswers[currentIndex] = idx;
          loadQuestion();
        };
        grid.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = currentIndex === 0;
      
      if(currentIndex === questionsDatabase.length - 1) {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('skip-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'inline-block';
      } else {
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('skip-btn').style.display = 'inline-block';
        document.getElementById('submit-btn').style.display = 'none';
      }
    }

    function navigate(direction) {
      currentIndex += direction;
      loadQuestion();
    }

    function skipQuestion() {
      userAnswers[currentIndex] = "SKIPPED";
      navigate(1);
    }

    function confirmFinish() {
      if(confirm("Apni ki exam sesh korte chan?")) {
        calculateAndSubmit();
      }
    }

    function calculateAndSubmit() {
      let score = 0, correct = 0, wrong = 0, skipped = 0;
      let wrongList = [], skippedList = [];

      questionsDatabase.forEach((q, idx) => {
        const ans = userAnswers[idx];
        if(ans === null || ans === "SKIPPED") {
          skipped++;
          skippedList.push({ question: q.question, correctAnswer: q.options[q.correct] });
        } else if(ans === q.correct) {
          correct++;
          score += 1.00;
        } else {
          wrong++;
          score -= 0.25;
          wrongList.push({
            question: q.question,
            selectedAnswer: q.options[ans],
            correctAnswer: q.options[q.correct]
          });
        }
      });

      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      document.getElementById('final-score').innerText = score.toFixed(2);
      document.getElementById('correct-count').innerText = correct;
      document.getElementById('wrong-count').innerText = wrong;
      document.getElementById('skipped-count').innerText = skipped;

      db.collection("quiz_results 7").add({
        name: userName,
        score: score.toFixed(2),
        correct: correct,
        wrong: wrong,
        skipped: skipped,
        wrongQuestions: wrongList,
        skippedQuestions: skippedList,
        time: new Date()
      });
    }
  </script>
</body>
</html>
